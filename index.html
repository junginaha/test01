<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b">
<title>ONE DAY BOOKS OS</title>
<style>
:root{--bg:#0c0c0b;--panel:#141411;--paper:#f4efe4;--ink:#171814;--muted:#77746c;--line:#d8d0c2;--accent:#244f40}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#f4f1e9}body{min-height:100dvh;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #24241f;position:sticky;top:0;background:rgba(12,12,11,.94);backdrop-filter:blur(16px);z-index:20}
.brand{font-size:13px;font-weight:800;letter-spacing:.02em}.brand b{font-weight:500;color:#8b877f;margin-left:8px}.status{font-size:9px;letter-spacing:.16em;color:#68655f}
.view{display:none}.view.on{display:block}
.upload{min-height:calc(100dvh - 58px);display:grid;place-items:center;padding:28px 18px 68px}
.hero{width:min(100%,520px);text-align:center}.hero h1{font-family:"AppleMyungjo","Iowan Old Style","Noto Serif KR",serif;font-size:clamp(42px,12vw,74px);line-height:.98;letter-spacing:-.065em;font-weight:400;margin:0 0 18px}.hero p{color:#89857d;font-size:12px;margin:0 0 30px}
.drop{position:relative;width:100%;aspect-ratio:1.7/1;border:1px solid #35342f;border-radius:24px;background:linear-gradient(180deg,#151512,#10100f);display:grid;place-items:center;overflow:hidden}.drop:after{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.03);border-radius:15px}.drop.drag{border-color:#7d786f}
.pick{position:relative;z-index:2;border:0;border-radius:999px;padding:16px 26px;background:#f1ede4;color:#111;font-weight:800}.types{position:absolute;z-index:2;bottom:18px;font-size:9px;letter-spacing:.16em;color:#5f5c56}.demo{margin-top:18px;border:0;background:none;color:#757169;text-decoration:underline;text-underline-offset:4px;font-size:11px}
.processing{min-height:calc(100dvh - 58px);display:grid;place-items:center;text-align:center;padding:30px}.processing h2{font-family:"AppleMyungjo","Noto Serif KR",serif;font-weight:400;font-size:38px;letter-spacing:-.05em;margin:0 0 20px}.bar{width:180px;height:1px;background:#2f2f2b;overflow:hidden}.bar i{display:block;width:44%;height:1px;background:#eee8dd;animation:s 1.1s infinite}@keyframes s{from{transform:translateX(-110%)}to{transform:translateX(230%)}}
.result{padding:18px 0 40px}.rhead{padding:0 16px 14px;max-width:1000px;margin:auto}.eyebrow{font-size:9px;letter-spacing:.16em;color:#77736b;margin-bottom:7px}.rhead h2{margin:0;font-family:"AppleMyungjo","Noto Serif KR",serif;font-size:28px;font-weight:400;letter-spacing:-.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{border-top:1px solid #23231f;border-bottom:1px solid #23231f;background:#090908;padding:16px 10px 18px}.spread{display:flex;justify-content:center;gap:2px;max-width:900px;margin:auto}.page{width:min(44vw,380px);aspect-ratio:2/3;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;padding:50px 40px 40px;font-family:"AppleMyungjo","Iowan Old Style","Noto Serif KR",serif;box-shadow:0 20px 42px rgba(0,0,0,.3)}.page:first-child{box-shadow:-8px 18px 35px rgba(0,0,0,.24),inset -8px 0 12px rgba(0,0,0,.025)}.page:last-child{box-shadow:8px 18px 35px rgba(0,0,0,.24),inset 8px 0 12px rgba(0,0,0,.025)}
.wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:clamp(14px,4vw,28px);font-weight:850;letter-spacing:.08em;white-space:nowrap;color:rgba(0,0,0,.035);pointer-events:none}.folio{position:absolute;bottom:20px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:8px;color:#8c867c}.page:nth-child(1) .folio{left:40px}.page:nth-child(2) .folio{right:40px}
.page p{font-size:13px;line-height:1.9;letter-spacing:-.018em;margin:0 0 1.08em;word-break:keep-all}.k{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:8px;letter-spacing:.16em;color:#6c685f;text-transform:uppercase}
.opener .num{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:74px;font-weight:850;line-height:.9;color:transparent;-webkit-text-stroke:1px #c9c0b1;margin:20px 0 58px;letter-spacing:-.08em}.opener h3{font-size:30px;line-height:1.28;font-weight:400;letter-spacing:-.055em;margin:0 0 18px}.opener .rule{width:38px;border-top:1.5px solid var(--accent);margin:20px 0}
.body .pull{font-size:17px;line-height:1.62;letter-spacing:-.04em;margin:12px 0 24px;max-width:88%}.body .rule{width:30px;border-top:1px solid var(--accent);margin:0 0 22px}
.key{padding-top:116px}.key blockquote{font-size:25px;line-height:1.55;letter-spacing:-.055em;margin:0;max-width:92%}.key .small{margin-top:34px;color:#757067;font-size:10px;line-height:1.8;max-width:72%}
.evidence h3,.action h3{font-size:24px;font-weight:400;letter-spacing:-.05em;margin:8px 0 26px}.item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid #bdb5a7}.item:last-child{border-bottom:1px solid #bdb5a7}.item .n{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:20px;font-weight:850;color:var(--accent);letter-spacing:-.05em}.item .t{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:9px;font-weight:800;margin-bottom:5px}.item .x{font-size:10.4px;line-height:1.65;color:#505149;word-break:keep-all}
.pause{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:82px}.pause .big{font-size:27px;line-height:1.55;letter-spacing:-.06em}.pause .tiny{margin-top:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:8px;color:#777168}
.nav{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:16px}.nav button{width:42px;height:42px;border-radius:50%;border:1px solid #34332e;background:#151513;color:#eee9df;font-size:18px}.count{font-size:9px;letter-spacing:.15em;color:#747068;min-width:68px;text-align:center}
.actions{display:flex;gap:9px;max-width:480px;margin:20px auto 0;padding:0 16px}.actions button{flex:1;height:50px;border-radius:999px}.approve{border:0;background:#f2eee5;color:#111;font-weight:800}.tweak{border:1px solid #3d3b36;background:transparent;color:#d8d3ca}
.sheetback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:flex-end}.sheetback.open{display:flex}.sheet{width:100%;max-width:560px;margin:auto;background:#f4efe6;color:#171713;border-radius:26px 26px 0 0;padding:24px 18px calc(18px + env(safe-area-inset-bottom))}.sheet h3{font-family:"AppleMyungjo","Noto Serif KR",serif;font-size:23px;font-weight:400;margin:0 0 18px}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{height:48px;border:1px solid #d2cabb;background:#fbf8f1;border-radius:14px}.done{margin-top:12px;width:100%;height:50px;border:0;border-radius:999px;background:#151512;color:#fff;font-weight:800}
.end{min-height:calc(100dvh - 58px);display:grid;place-items:center;text-align:center;padding:30px}.end h2{font-family:"AppleMyungjo","Noto Serif KR",serif;font-size:36px;font-weight:400;letter-spacing:-.055em;margin:0 0 14px}.end p{font-size:12px;color:#77736b;margin:0}
@media(max-width:680px){.spread{display:block}.page{width:min(86vw,390px);margin:auto;padding:44px 34px 38px}.page+ .page{display:none}.page:nth-child(1) .folio{left:34px}.rhead h2{font-size:25px}.opener .num{font-size:64px}.opener h3{font-size:27px}.page p{font-size:12.6px}.key blockquote{font-size:23px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<header class="top"><div class="brand">ONE DAY BOOKS <b>OS</b></div><div class="status" id="status">READY</div></header>
<main>
<section class="view on" id="upload"><div class="upload"><div class="hero"><h1>원고를<br>넣어주세요.</h1><p>책에 가장 어울리는 방향을 먼저 보여드립니다.</p><div class="drop" id="drop"><button class="pick" id="pick">원고 선택</button><div class="types">HWPX · DOCX · PDF · TXT</div><input id="file" type="file" accept=".hwpx,.docx,.pdf,.txt,.md" hidden></div><button class="demo" id="demo">샘플로 보기</button></div></div></section>
<section class="view" id="processing"><div class="processing"><div><h2>책을 읽고 있습니다.</h2><div class="bar"><i></i></div></div></div></section>
<section class="view" id="result"><div class="result"><div class="rhead"><div class="eyebrow">RECOMMENDED PREVIEW</div><h2 id="title">미리보기</h2></div><div class="stage"><div class="spread" id="spread"></div></div><div class="nav"><button id="prev">‹</button><div class="count" id="count">01 / 10</div><button id="next">›</button></div><div class="actions"><button class="tweak" id="tweak">조금 수정</button><button class="approve" id="approve">이대로 진행</button></div></div></section>
<section class="view" id="end"><div class="end"><div><h2>방향을 저장했습니다.</h2><p>다음 단계는 전체 조판입니다.</p></div></div></section>
</main>
<div class="sheetback" id="sheetback"><div class="sheet"><h3>어떻게 바꿀까요?</h3><div class="chips"><button class="chip" data-adjust="calm">더 차분하게</button><button class="chip" data-adjust="clear">더 선명하게</button><button class="chip" data-adjust="large">글씨 조금 크게</button><button class="chip" data-adjust="space">여백 조금 넓게</button></div><button class="done" id="done">적용</button></div></div>
<script>
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
var views=['upload','processing','result','end'];function show(id){views.forEach(function(v){document.getElementById(v).classList.toggle('on',v===id)});document.getElementById('status').textContent=id==='upload'?'READY':id==='processing'?'READING':id==='result'?'PREVIEW':'SAVED'}
var fileInput=document.getElementById('file'),pick=document.getElementById('pick'),drop=document.getElementById('drop'),demo=document.getElementById('demo');
pick.onclick=function(){fileInput.click()};fileInput.onchange=function(){if(fileInput.files[0])run(fileInput.files[0])}
;['dragenter','dragover'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('drag')})});['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('drag')})});drop.addEventListener('drop',function(e){var f=e.dataTransfer.files[0];if(f)run(f)});
demo.onclick=function(){var sample='돈의 면접\n운과 부를 끌어당기는 에너지\n\n우리는 돈을 벌기 위해 수많은 선택을 합니다. 그러나 정작 돈을 대하는 태도는 배운 적이 없습니다.\n\n질문 하나가 있습니다. 돈은 나를 어떻게 평가하고 있을까요?\n\n2005년 스탠퍼드대학교 졸업식 연설에서 스티브 잡스는 연결되지 않던 점들이 시간이 지나며 이어진다고 말했습니다.\n\n첫째, 돈을 피하지 마세요. 둘째, 작은 숫자부터 기록하세요. 셋째, 반복해서 확인하세요.\n\n실패는 끝이 아니라 아직 충분히 배우지 못했다는 신호일 뿐입니다.';build(sample,'돈의 면접')}
async function run(file){show('processing');try{var text=await extract(file);if(!text||text.trim().length<30)throw new Error('empty');build(text,file.name.replace(/\.[^.]+$/,''))}catch(e){alert('원고를 읽지 못했습니다. TXT, DOCX, HWPX, PDF 파일로 다시 시도해 주세요.');show('upload')}}
async function extract(file){var name=file.name.toLowerCase();if(name.endsWith('.txt')||name.endsWith('.md'))return await file.text();var buf=await file.arrayBuffer();if(name.endsWith('.docx')){var r=await mammoth.extractRawText({arrayBuffer:buf});return r.value}
if(name.endsWith('.hwpx')){var zip=await JSZip.loadAsync(buf),parts=[];var names=Object.keys(zip.files).filter(function(n){return /Contents\/section\d+\.xml/i.test(n)}).sort();for(var i=0;i<names.length;i++){var x=await zip.file(names[i]).async('text');var d=new DOMParser().parseFromString(x,'text/xml');var nodes=d.getElementsByTagNameNS('*','t');for(var j=0;j<nodes.length;j++)parts.push(nodes[j].textContent);parts.push('\n')}return parts.join(' ')}
if(name.endsWith('.pdf')){var pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise,all=[];for(var p=1;p<=Math.min(pdf.numPages,80);p++){var pg=await pdf.getPage(p),tc=await pg.getTextContent();all.push(tc.items.map(function(it){return it.str}).join(' '))}return all.join('\n')}return ''}
function clean(text){return text.replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim()}
function splitParas(text){return clean(text).split(/\n+/).map(function(s){return s.trim()}).filter(function(s){return s.length>8})}
function classify(p){if(p.length<35&&!/[.!?。]/.test(p))return'heading';if(/첫째|둘째|셋째|하세요|해보세요|바랍니다/.test(p))return'action';if(/\d{4}|%|통계|조사|연구|사례|달러|원|억|만/.test(p))return'evidence';if(/\?$/.test(p)||p.indexOf('?')>=0)return'key';if(p.length<90)return'key';return'body'}
function take(paras,type,n){var a=paras.filter(function(p){return classify(p)===type});return a.slice(0,n)}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sentence(s,max){var x=(s||'').replace(/\s+/g,' ').trim();return x.length>max?x.slice(0,max).replace(/\s+\S*$/,'')+'…':x}
var pages=[],idx=0,adjust='';
function build(text,name){var ps=splitParas(text),heads=take(ps,'heading',4),bodies=take(ps,'body',12),keys=take(ps,'key',6),evid=take(ps,'evidence',6),acts=take(ps,'action',6);var title=(heads[0]||name||'새 책').replace(/^\d+[.)]\s*/,'');document.getElementById('title').textContent=title;
pages=[
{t:'opener',h:heads[1]||title,a:sentence(keys[0]||bodies[0]||'이 책의 첫 장면입니다.',120)},
{t:'body',q:sentence(keys[0]||bodies[0],80),p:[bodies[0],bodies[1],bodies[2]].filter(Boolean)},
{t:'body',q:sentence(keys[1]||bodies[3],84),p:[bodies[3],bodies[4],bodies[5]].filter(Boolean)},
{t:'key',q:sentence(keys[2]||bodies[2]||'핵심 문장을 한 번 더 읽습니다.',130),s:sentence(bodies[4]||'',100)},
{t:'evidence',h:heads[2]||'근거와 사례',p:(evid.length?evid:bodies.slice(5,8)).slice(0,3)},
{t:'body',q:sentence(keys[3]||bodies[6],82),p:[bodies[6],bodies[7],bodies[8]].filter(Boolean)},
{t:'action',h:heads[3]||'지금 할 일',p:(acts.length?acts:bodies.slice(8,11)).slice(0,3)},
{t:'key',q:sentence(keys[4]||bodies[9]||'생각이 바뀌면 선택이 달라집니다.',125),s:sentence(bodies[10]||'',95)},
{t:'body',q:sentence(keys[5]||bodies[10],82),p:[bodies[10],bodies[11],ps[Math.max(0,ps.length-2)]].filter(Boolean)},
{t:'pause',q:sentence(ps[ps.length-1]||'이제 다음 장으로 넘어갑니다.',105)}
];idx=0;adjust='';show('result');render()}
function pageHTML(p,n){var inner='';if(p.t==='opener')inner='<div class="k">CHAPTER</div><div class="num">'+String(n).padStart(2,'0')+'</div><h3>'+esc(p.h)+'</h3><div class="rule"></div><p>'+esc(p.a)+'</p>';if(p.t==='body')inner='<div class="k">READ</div><div class="pull">'+esc(p.q)+'</div><div class="rule"></div>'+(p.p||[]).map(function(x){return'<p>'+esc(sentence(x,230))+'</p>'}).join('');if(p.t==='key')inner='<div class="k">PAUSE</div><blockquote>'+esc(p.q)+'</blockquote><div class="small">'+esc(p.s)+'</div>';if(p.t==='evidence')inner='<div class="k">EVIDENCE</div><h3>'+esc(p.h)+'</h3>'+(p.p||[]).map(function(x,i){return'<div class="item"><div class="n">'+String(i+1).padStart(2,'0')+'</div><div><div class="t">CASE</div><div class="x">'+esc(sentence(x,120))+'</div></div></div>'}).join('');if(p.t==='action')inner='<div class="k">ACTION</div><h3>'+esc(p.h)+'</h3>'+(p.p||[]).map(function(x,i){return'<div class="item"><div class="n">'+String(i+1).padStart(2,'0')+'</div><div><div class="t">STEP</div><div class="x">'+esc(sentence(x,120))+'</div></div></div>'}).join('');if(p.t==='pause')inner='<div class="k">NEXT</div><div class="big">'+esc(p.q)+'</div><div class="tiny">ONE DAY BOOKS OS</div>';return'<article class="page '+p.t+(adjust?' '+adjust:'')+'"><div class="wm">ONE DAY BOOKS</div>'+inner+'<div class="folio">'+String(n).padStart(2,'0')+'</div></article>'}
function render(){var left=pages[idx],right=pages[Math.min(idx+1,pages.length-1)],html=pageHTML(left,idx+1);if(innerWidth>680&&idx+1<pages.length)html+=pageHTML(right,idx+2);document.getElementById('spread').innerHTML=html;document.getElementById('count').textContent=String(idx+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0')}
document.getElementById('prev').onclick=function(){idx=Math.max(0,idx-(innerWidth>680?2:1));render()};document.getElementById('next').onclick=function(){idx=Math.min(pages.length-1,idx+(innerWidth>680?2:1));render()};addEventListener('resize',render);
var sheetback=document.getElementById('sheetback');document.getElementById('tweak').onclick=function(){sheetback.classList.add('open')};sheetback.onclick=function(e){if(e.target===sheetback)sheetback.classList.remove('open')};document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){adjust=b.dataset.adjust;document.querySelectorAll('.chip').forEach(function(x){x.style.background='#fbf8f1'});b.style.background='#ded6c8'}});document.getElementById('done').onclick=function(){sheetback.classList.remove('open');render()};document.getElementById('approve').onclick=function(){show('end')}
</script>
</body></html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3efe6" />
  <meta name="description" content="ONE DAY BOOKS OS — 원고를 넣으면 책의 방향과 10쪽 미리보기를 먼저 보여주는 출판 편집디자인 OS 프로토타입" />
  <title>ONE DAY BOOKS OS</title>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="wordmark" id="homeBtn" aria-label="홈으로">
      <span>ONE DAY BOOKS</span>
      <strong>OS</strong>
    </button>
    <div class="top-status" id="topStatus">READY</div>
  </header>

  <main>
    <section class="screen active" id="screen-home">
      <div class="home-wrap">
        <div class="hero-copy">
          <div class="kicker">PUBLISHING OPERATING SYSTEM</div>
          <h1>원고를<br />넣어주세요.</h1>
          <p>책에 가장 어울리는 방향을 먼저 보여드립니다.</p>
        </div>

        <div class="upload-card" id="dropZone">
          <input id="fileInput" type="file" accept=".hwpx,.docx,.pdf,.txt,.md" hidden />
          <button class="primary" id="chooseFile">원고 선택</button>
          <div class="formats">HWPX · DOCX · PDF · TXT</div>
        </div>

        <button class="text-button" id="runDemo">샘플로 보기</button>
      </div>
    </section>

    <section class="screen" id="screen-reading">
      <div class="reading-wrap">
        <div class="reading-mark">OS</div>
        <h2>책을 읽고 있습니다.</h2>
        <div class="progress"><span></span></div>
      </div>
    </section>

    <section class="screen" id="screen-preview">
      <div class="preview-head">
        <div>
          <div class="kicker">OS RECOMMENDED</div>
          <h2 id="bookTitle">미리보기</h2>
        </div>
        <button class="icon-btn" id="restartBtn" aria-label="다른 원고 넣기">↺</button>
      </div>

      <div class="preview-shell" id="previewShell">
        <div class="book-stage" id="bookStage"></div>
      </div>

      <div class="pager">
        <button class="pager-btn" id="prevPage" aria-label="이전 페이지">←</button>
        <span id="pageCount">01 / 10</span>
        <button class="pager-btn" id="nextPage" aria-label="다음 페이지">→</button>
      </div>

      <div class="bottom-actions">
        <button class="secondary" id="adjustBtn">조금 수정</button>
        <button class="primary wide" id="approveBtn">이대로 진행</button>
      </div>
    </section>

    <section class="screen" id="screen-approved">
      <div class="approved-wrap">
        <div class="approved-mark">OS</div>
        <h2>방향을 저장했습니다.</h2>
        <p>이 디자인 방향으로 전체 제작을 이어갑니다.</p>
        <button class="primary" id="newManuscriptBtn">새 원고 넣기</button>
      </div>
    </section>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <h3 id="sheetTitle">어떻게 바꿀까요?</h3>
      <div class="adjust-grid">
        <button class="adjust-option" data-adjust="quiet">더 차분하게</button>
        <button class="adjust-option" data-adjust="crisp">더 선명하게</button>
        <button class="adjust-option" data-adjust="large">글씨 조금 크게</button>
        <button class="adjust-option" data-adjust="airy">여백 조금 넓게</button>
      </div>
      <button class="primary wide" id="applyAdjust">적용</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
